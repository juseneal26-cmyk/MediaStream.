server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html,
    # para que las rutas de React Router (/catalogo, /titulos/1, etc.)
    # funcionen también al recargar la página directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"status":"ok","service":"frontend"}';
        add_header Content-Type application/json;
    }
}
